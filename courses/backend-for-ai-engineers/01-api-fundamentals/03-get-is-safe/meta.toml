id = "get-is-safe"
title = "GET never changes anything"
summary = "Reading must be harmless. To delete, use the DELETE method."
minutes = 12
version = 1
optional_steps = ["prove", "defend"]

[[goals]]
id = "g1"
text = "`DELETE /prompts/{id}` removes the prompt and returns `204 No Content` with an empty body."

[[goals]]
id = "g2"
text = "Deleting an id that doesn't exist returns `404`, never `500`."

[[goals]]
id = "g3"
text = "`GET` requests never delete anything."

