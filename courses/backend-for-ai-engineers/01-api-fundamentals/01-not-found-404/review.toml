model_review = """
**Request changes.**

- 🔴 **Must fix, line 21:** an unknown id returns `200 OK` with `null`. The mobile app trusts the `200` and shows an empty prompt. Raise `HTTPException(status_code=404)` when the id isn't in `prompts`.

Everything else looks good. `/prompts/1` works because that prompt exists; it's the *missing* case that wasn't tried.
"""
teaching_comment = """
> Line 21: what should the app see when it asks for prompt 99? Right now it gets `200` and `null`, which says "success, and the prompt is empty". Could you raise `HTTPException(status_code=404)` when the id isn't there? The FastAPI "Handling Errors" page shows the exact pattern.

Ask a question first, then explain why, then point to where to learn more.
"""

