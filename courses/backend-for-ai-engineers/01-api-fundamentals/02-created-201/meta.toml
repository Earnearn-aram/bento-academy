id = "created-201"
title = "Created means 201"
summary = "When you create something, say so (201) and say where it lives (Location)."
minutes = 12
version = 1
optional_steps = ["prove", "defend"]

[[goals]]
id = "g1"
text = "Creating a prompt returns `201 Created` (and the new prompt, with its id)."

[[goals]]
id = "g2"
text = "The response has a `Location` header that points at the new prompt, like `/prompts/3`."

[[goals]]
id = "g3"
text = "The new prompt can be fetched at that address (this already works: keep it working)."

